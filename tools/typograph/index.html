    <main class="main">
      <div class="wrap-wide">
        <section id="typograph" class="info typograph-tool">
          <div class="info-block">
            <div class="hero-text">
              <h1 class="name main-text">Типограф.</h1>
              <p class="tool-subtitle">Нормализует текст и удаляет артефакты набора.</p>
            </div>

            <div class="typograph-panels">
              <label class="typograph-panel">
                <span class="typograph-label">исходный текст</span>
                <textarea
                  id="typograph-input"
                  class="typograph-textarea"
                  spellcheck="false"
                  placeholder="Вставьте текст из PDF, Figma, Word, Telegram, OCR…"
                ></textarea>
              </label>

              <div class="typograph-arrow" aria-hidden="true">→</div>

              <label class="typograph-panel">
                <span class="typograph-label">очищенный текст</span>
                <textarea
                  id="typograph-output"
                  class="typograph-textarea"
                  readonly
                  spellcheck="false"
                  placeholder="Результат появится здесь"
                ></textarea>
              </label>
            </div>

            <div class="typograph-controls">
              <button type="button" class="typograph-btn" id="typograph-auto-clean">auto clean</button>
              <button type="button" class="typograph-btn typograph-btn--ghost" id="typograph-copy">copy</button>
              <button type="button" class="typograph-btn typograph-btn--ghost" id="typograph-clear">clear</button>

              <div class="typograph-toggles">
                <label class="typograph-toggle">
                  <input type="checkbox" id="typograph-line-merge" />
                  line merge
                </label>
                <label class="typograph-toggle">
                  <input type="checkbox" id="typograph-aggressive" />
                  aggressive cleanup
                </label>
              </div>
            </div>

            <div class="typograph-stats" aria-live="polite">
              <span><strong id="stat-characters">0</strong> characters fixed</span>
              <span><strong id="stat-artifacts">0</strong> artifacts removed</span>
              <span><strong id="stat-replacements">0</strong> replacements</span>
              <span><strong id="stat-invisible">0</strong> invisible chars removed</span>
              <span class="typograph-script">язык: <strong id="stat-script">язык не определён</strong></span>
            </div>

            <a class="typograph-back" href="../../tools.html">← все tools</a>
          </div>
        </section>
      </div>
    </main>
